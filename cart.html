<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | Legendry Toy Cars</title>
    <link rel="icon" href="/vehicle.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>
<body data-page="cart">
    <main>
        <nav class="account-nav" aria-label="Account navigation">
            <a href="/">Home</a>
            <a href="/products/index.html">Catalog</a>
            <a href="/cart.html">My cart</a>
            <span id="account-name"></span>
            <button id="logout" type="button">Log out</button>
        </nav>
        <h1>My shopping cart</h1>
        <p id="status" role="status" aria-live="polite">Loading your cart...</p>
        <section id="cart-items" aria-label="Cart items"></section>
        <p id="cart-total" class="price" aria-live="polite"></p>
        <a class="button" href="/products/index.html">Continue shopping</a>
    </main>
    <template id="cart-item">
        <article class="cart-item">
            <img class="product-image" alt="Illustrative toy vehicle image" width="160" height="90">
            <div>
                <h2 class="product-name"></h2>
                <p class="unit-price"></p>
                <div class="cart-controls"></div>
                <p class="subtotal"></p>
            </div>
        </article>
    </template>
</body>
</html>
