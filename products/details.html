<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Legendry Vehicles</title>
    <link rel="icon" href="/vehicle.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>
<body data-page="details">
    <main>
        <a href="/products/index.html">&larr; Back to catalog</a>
        <p id="status" role="status" aria-live="polite">Loading product...</p>
        <section id="product" aria-label="Product details"></section>
    </main>

    <template id="product-detail">
        <article class="detail">
            <img class="product-image" alt="Sample vehicle illustration" width="640" height="360">
            <div>
                <p class="eyebrow">Legendry Vehicles</p>
                <h1 class="product-name"></h1>
                <p class="product-description"></p>
                <dl>
                    <dt>Price</dt>
                    <dd class="price"></dd>
                    <dt>Availability</dt>
                    <dd class="stock"></dd>
                    <dt>Product ID</dt>
                    <dd class="product-id"></dd>
                </dl>
                <p class="muted">Illustrative image. These are sample products for the assignment.</p>
            </div>
        </article>
    </template>
</body>
</html>
