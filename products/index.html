<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Vehicle Catalog | Legendry Toy Cars</title>
    <link rel="icon" href="/vehicle.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>
<body data-page="catalog">
    <main>
        <nav class="account-nav" aria-label="Account navigation">
            <a href="/">Home</a>
            <a href="/products/index.html">Catalog</a>
            <a href="/cart.html">My cart</a>
            <span id="account-name"></span>
            <button id="logout" type="button">Log out</button>
        </nav>
        <a href="/">&larr; Home</a>
        <h1>Toy Vehicle Catalog</h1>
        <p>Items in your cart appear first. Add toys and adjust quantities right here.</p>

        <form class="search" action="/products/index.html" method="get">
            <label for="search">Search toy vehicles</label>
            <div class="search-controls">
                <input id="search" name="q" type="search" maxlength="100" placeholder="Search by name or description">
                <button type="submit">Search</button>
            </div>
        </form>

        <p id="status" role="status" aria-live="polite">Loading toy vehicles...</p>
        <p id="catalog-cart-total" class="price" aria-live="polite"></p>
        <section id="products" class="products" aria-label="Available toy vehicles"></section>
    </main>

    <template id="product-card">
        <article class="card">
            <img class="product-image" alt="Illustrative vehicle image for a toy model" width="640" height="360">
            <div class="card-content">
                <h2 class="product-name"></h2>
                <p class="product-description"></p>
                <p class="price"></p>
                <p class="stock"></p>
                <a class="button details-link">View details</a>
                <div class="cart-controls"></div>
            </div>
        </article>
    </template>
</body>
</html>
